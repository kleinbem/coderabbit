# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Central CodeRabbit config for every kleinbem repo. A repo's own
# .coderabbit.yaml replaces this file unless it sets `inheritance: true`, in
# which case it merges on top. The web UI settings don't apply while this file
# exists.

language: en-GB
tone_instructions: "Short and direct. Lead with the problem and the fix. No praise, no filler."
early_access: false

reviews:
  profile: chill
  # PRs auto-merge once green; reviews inform, they don't block.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  # The CodeRabbit check is required: a review that errors must block, not pass.
  fail_commit_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    # Lock bumps, docs syncs and dependency updates: not worth the rate limit.
    ignore_usernames:
      - "kleinbem-bot[bot]"
      - "dependabot[bot]"

  # Generated or vendored files.
  path_filters:
    - "!**/flake.lock"
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    - "!**/INFRASTRUCTURE.yaml"
    - "!infra/*.json"
    - "!traffic_data/**"
    - "!governance-report.json"
    - "!DASHBOARD.md"

  path_instructions:
    - path: "**/*.nix"
      instructions: |
        NixOS fleet config. Check especially:
        - sops.secrets for a feature must be gated behind that feature's enable option; a secret for a disabled feature breaks activation.
        - /var is tmpfs on every host: new service state needs an impermanence/persistence entry.
        - No plaintext secrets; they belong in kleinbem-secrets (sops).
        - Prefer upstream nixpkgs options over custom wrappers.
    - path: "**/*.sh"
      instructions: "Scripts run under `set -euo pipefail`: flag unbound variables and unquoted expansions."
    - path: ".github/workflows/**"
      instructions: "Third-party actions must be pinned by commit SHA. Secrets must not reach pull_request runs from forks; flag pull_request_target and self-hosted runners."
    - path: "**/*.tf"
      instructions: "OpenTofu. Watch for changes that force replacement or destroy existing resources, and for secrets in plain variables or outputs."

chat:
  auto_reply: true
